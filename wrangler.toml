name = "form2email-router"
main = "src/worker.py"
compatibility_date = "2026-10-24"
compatibility_flags = ["python_workers"]

[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.svg", "**/*.html", "**/*.txt", "**/*.sql"]

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.bin"]

routes = [
  { pattern = "form2email.terragohan.com/*", zone_name = "terragohan.com" },
]

[vars]
BASE_URL = "https://form2email.terragohan.com"
MAIL_FROM = "form2email@terragohan.com"
GOOGLE_TAG_ID = "G-E693TN1RMF"

[[d1_databases]]
binding = "DB"
database_name = "form_to_email"
database_id = "b36ad3ec-a11d-4233-8266-aadd1996384c"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"
