[project]
name = "form2email"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mangum>=0.22.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "resend>=2.49.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
