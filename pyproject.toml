[project]
name = "form2email"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.142.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.1",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
