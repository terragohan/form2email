<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#edf1fa"/>

  <!-- Decorative paper plane, top right -->
  <g transform="translate(960,70) rotate(10)">
    <path d="M10 56 L110 12 L68 92 L52 62 Z" fill="#dbe7fd"
      stroke="#1c2430" stroke-width="5" stroke-linejoin="round"/>
    <path d="M52 62 L108 14" fill="none" stroke="#1c2430" stroke-width="4"
      stroke-linecap="round"/>
  </g>

  <!-- Decorative @ doodle, bottom left -->
  <g transform="translate(90,440)">
    <path d="M86 52 a36 36 0 1 0 2 13" fill="none" stroke="#1c2430"
      stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="14" fill="#e8eefc" stroke="#1c2430"
      stroke-width="5"/>
    <path d="M64 38 v22 c0 9 16 10 19 1" fill="none" stroke="#1c2430"
      stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Logo chip: blue wobble square with envelope -->
  <g transform="translate(140,190) rotate(-2)">
    <rect x="0" y="0" width="180" height="180" rx="34" fill="#2563eb"
      stroke="#1c2430" stroke-width="8"/>
    <rect x="34" y="52" width="112" height="74" rx="10" fill="#ffffff"
      stroke="#1c2430" stroke-width="8"/>
    <path d="M40 60 L90 96 L140 58" fill="none" stroke="#1c2430"
      stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="370" y="290" font-family="'Avenir Next','Trebuchet MS',sans-serif"
    font-size="96" font-weight="700" fill="#1c2430">Form2<tspan
    fill="#2563eb">Email</tspan></text>

  <!-- Tagline -->
  <text x="372" y="365" font-family="'Avenir Next','Trebuchet MS',sans-serif"
    font-size="34" fill="#4a5668">Form submissions straight to your inbox</text>

  <!-- URL pill -->
  <g transform="translate(372,415) rotate(-1)">
    <rect x="0" y="0" width="472" height="64" rx="18" fill="#dbe7fd"
      stroke="#1c2430" stroke-width="5"/>
    <text x="26" y="43" font-family="'Avenir Next','Trebuchet MS',sans-serif"
      font-size="30" font-weight="600" fill="#1c2430">form2email.terragohan.com</text>
  </g>

  <!-- Squiggle under the tagline -->
  <path d="M372 388 Q 392 380, 412 386 T 452 386 T 492 386 T 532 386 T 572 386 T 612 386 T 652 386"
    fill="none" stroke="#1c2430" stroke-width="4" stroke-linecap="round"/>
</svg>
